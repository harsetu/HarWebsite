[build]
  command = "rm -rf flutter_sdk && git clone https://github.com/flutter/flutter.git -b 3.44.8 --depth 1 flutter_sdk && flutter_sdk/bin/flutter pub get && flutter_sdk/bin/flutter build web --release"
  publish = "build/web"

[build.environment]
  # Netlify's Ubuntu build image needs this so `flutter` finds its cache dir.
  PUB_CACHE = "/opt/build/cache/.pub-cache"
