<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7EFE3"/>
      <stop offset="100%" stop-color="#EAD9BC"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E1E0A"/>
      <stop offset="100%" stop-color="#B9781F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg2)"/>

  <!-- clock icon -->
  <g transform="translate(960,200)">
    <circle r="120" fill="#ffffff" stroke="url(#clockGrad)" stroke-width="10"/>
    <circle r="6" fill="#1e293b"/>
    <line x1="0" y1="0" x2="0" y2="-75" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="55" y2="20" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <!-- tick marks -->
    <g stroke="#94a3b8" stroke-width="4">
      <line x1="0" y1="-100" x2="0" y2="-90"/>
      <line x1="0" y1="100" x2="0" y2="90"/>
      <line x1="-100" y1="0" x2="-90" y2="0"/>
      <line x1="100" y1="0" x2="90" y2="0"/>
    </g>
    <!-- checkmark badge -->
    <circle cx="95" cy="90" r="42" fill="#22c55e" stroke="#F7EFE3" stroke-width="6"/>
    <path d="M 76 90 L 90 105 L 116 74" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- headline -->
  <text x="70" y="165" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#3E1E0A">We Deliver IT Projects On Time</text>
  <text x="70" y="212" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#6B4A32">So you never have to worry about deadlines again</text>

  <!-- three quick proof points -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3E1E0A">
    <circle cx="82" cy="270" r="6" fill="#3E1E0A"/>
    <text x="100" y="276">On-schedule delivery</text>

    <circle cx="82" cy="310" r="6" fill="#3E1E0A"/>
    <text x="100" y="316">Transparent milestones</text>

    <circle cx="82" cy="350" r="6" fill="#3E1E0A"/>
    <text x="100" y="356">Zero surprises</text>
  </g>
</svg>
