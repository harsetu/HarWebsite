<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E1E0A"/>
      <stop offset="60%" stop-color="#3E1E0A"/>
      <stop offset="100%" stop-color="#1F0F05"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0C674"/>
      <stop offset="100%" stop-color="#B9781F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg4)"/>

  <!-- circuit-style background lines -->
  <g stroke="#7A4A1E" stroke-width="2" fill="none" opacity="0.5">
    <path d="M0,340 H260 V300 H520"/>
    <path d="M0,60 H180 V100 H400"/>
    <path d="M1200,80 H980 V140 H760"/>
    <path d="M1200,360 H1000 V320 H820"/>
  </g>
  <g fill="#D9A441" opacity="0.6">
    <circle cx="260" cy="340" r="4"/>
    <circle cx="520" cy="300" r="4"/>
    <circle cx="180" cy="60" r="4"/>
    <circle cx="400" cy="100" r="4"/>
    <circle cx="980" cy="80" r="4"/>
    <circle cx="760" cy="140" r="4"/>
    <circle cx="1000" cy="360" r="4"/>
    <circle cx="820" cy="320" r="4"/>
  </g>

  <!-- accent bar -->
  <rect x="70" y="120" width="90" height="10" rx="5" fill="url(#accentBar)"/>

  <!-- headline -->
  <text x="70" y="205" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Your IT Partner.</text>
  <text x="70" y="265" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#D9A441">Delivered On Time.</text>

  <text x="70" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#C9A876">Full IT solutions for your organization — planned, built, and shipped on schedule.</text>
</svg>
