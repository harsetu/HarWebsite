<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E1E0A"/>
      <stop offset="100%" stop-color="#6B3A1B"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A441"/>
      <stop offset="100%" stop-color="#B9781F"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#leftGrad)"/>
  <rect x="600" width="600" height="400" fill="url(#rightGrad)"/>

  <!-- center divider badge -->
  <circle cx="600" cy="200" r="34" fill="#F7EFE3"/>
  <text x="600" y="209" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#3E1E0A" text-anchor="middle">+</text>

  <!-- LEFT: gear/solutions icon -->
  <g transform="translate(150,120)" fill="none" stroke="#E8C99A" stroke-width="6">
    <circle r="46"/>
    <g stroke-width="10" stroke-linecap="round">
      <line x1="0" y1="-58" x2="0" y2="-70"/>
      <line x1="0" y1="58" x2="0" y2="70"/>
      <line x1="-58" y1="0" x2="-70" y2="0"/>
      <line x1="58" y1="0" x2="70" y2="0"/>
      <line x1="41" y1="-41" x2="49" y2="-49"/>
      <line x1="-41" y1="-41" x2="-49" y2="-49"/>
      <line x1="41" y1="41" x2="49" y2="49"/>
      <line x1="-41" y1="41" x2="-49" y2="49"/>
    </g>
  </g>
  <circle cx="150" cy="120" r="14" fill="#E8C99A"/>

  <text x="70" y="230" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff">IT Solutions</text>
  <text x="70" y="264" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#E8C99A">Built for your organization's needs</text>

  <!-- RIGHT: calendar/check icon -->
  <g transform="translate(750,120)">
    <rect x="-45" y="-38" width="90" height="76" rx="10" fill="#ffffff"/>
    <rect x="-45" y="-38" width="90" height="24" rx="10" fill="#3E1E0A"/>
    <rect x="-45" y="-14" width="90" height="10" fill="#3E1E0A"/>
    <line x1="-24" y1="-48" x2="-24" y2="-28" stroke="#3E1E0A" stroke-width="6" stroke-linecap="round"/>
    <line x1="24" y1="-48" x2="24" y2="-28" stroke="#3E1E0A" stroke-width="6" stroke-linecap="round"/>
    <path d="M -20 12 L -5 27 L 26 -6" fill="none" stroke="#22c55e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="670" y="230" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#3E1E0A">On-Time Delivery</text>
  <text x="670" y="264" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5b3a1a">So you never have to worry</text>
</svg>
